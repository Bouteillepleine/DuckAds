name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shell syntax
        run: |
          for f in module/duckads.sh module/service.sh module/post-fs-data.sh \
                   module/boot-completed.sh module/customize.sh module/uninstall.sh \
                   module/action.sh module/lib/*.sh; do
            sh -n "$f"
          done

      - name: awk syntax
        run: |
          awk -f module/lib/parse.awk /dev/null
          awk -f module/lib/filter.awk -v WL=/dev/null /dev/null

      - name: parser golden test
        run: bash scripts/test-parser.sh

      - name: root manager detection matrix
        run: bash scripts/test-managers.sh

      - name: package
        run: bash scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: DuckAds
          path: release/*.zip

      - name: release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          body_path: CHANGELOG.md
