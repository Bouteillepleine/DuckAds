name: ci

on:
  push:
    branches: [main, prerelease]
  pull_request:
    branches: [main, prerelease]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shell syntax
        run: |
          for f in module/duckads.sh module/service.sh module/post-fs-data.sh \
                   module/boot-completed.sh module/customize.sh module/uninstall.sh \
                   module/action.sh module/lib/*.sh; do
            sh -n "$f"
          done

      - name: awk syntax
        run: |
          awk -f module/lib/parse.awk /dev/null
          awk -f module/lib/filter.awk -v WL=/dev/null /dev/null
          awk -f module/lib/catalog.awk -v SRCS=/dev/null -v STAT=/dev/null /dev/null
          awk -f module/lib/apps.awk -v EX=/dev/null /dev/null

      - name: no CRLF
        run: |
          if grep -rlU $'\r' module --exclude='*.png'; then
            echo "CRLF found"
            exit 1
          fi

      - name: parser golden test
        run: bash scripts/test-parser.sh

      - name: root manager detection matrix
        run: bash scripts/test-managers.sh

      - name: package
        run: bash scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: DuckAds-${{ github.ref_name }}
          path: release/*.zip
